<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>御神啟示錄 ✦ 78星軌深度占卜</title>
    <style>
        :root {
            --bg-color: #060409;
            --card-bg: #110e1a;
            --gold: #dfb755;
            --gold-glow: rgba(223, 183, 85, 0.35);
            --text-main: #e6e2f0;
            --text-sub: #968fa3;
            --purple-glow: rgba(147, 112, 219, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* 畫布：懸浮粒子特效 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none; /* 讓粒子不影響點擊操作 */
        }

        header, .card-container, .result-panel, .btn {
            position: relative;
            z-index: 1; /* 確保內容在粒子上方 */
        }

        header {
            text-align: center;
            margin: 15px 0 30px 0;
        }

        h1 {
            color: var(--gold);
            font-size: 1.6rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--gold-glow);
            font-weight: 600;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.5;
            max-width: 320px;
            margin: 0 auto;
        }

        /* 牌陣區域 */
        .card-container {
            width: 100%;
            max-width: 360px;
            height: 270px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .tarot-card {
            width: 150px;
            height: 250px;
            perspective: 1200px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 15px var(--purple-glow);
            border-radius: 14px;
        }

        .tarot-card.shuffling .card-inner {
            animation: shuffle-effect 0.6s ease-in-out infinite alternate;
        }

        .tarot-card.flipped .card-inner {
            transform: rotateY(180deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px var(--gold-glow);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 14px;
            border: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .card-back {
            background: linear-gradient(135deg, #0e0a1a 0%, #1a1230 100%);
            color: var(--gold);
            border: 2px solid #5a4b2a;
        }
        .card-back::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px dashed rgba(223, 183, 85, 0.25);
            border-radius: 10px;
        }
        .card-back::after {
            content: "✧\A✦\A✧";
            white-space: pre;
            font-size: 1.8rem;
            line-height: 1.2;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .card-front {
            background-color: var(--card-bg);
            transform: rotateY(180deg);
            justify-content: space-between;
            overflow: hidden;
        }

        .card-front.reversed-visual {
            transform: rotateY(180deg) rotateZ(180deg);
        }

        .card-title {
            color: var(--gold);
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1.3;
        }

        .card-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 12px rgba(223,183,85,0.4));
        }

        .card-orientation {
            font-size: 0.75rem;
            background: rgba(223, 183, 85, 0.15);
            color: var(--gold);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(223, 183, 85, 0.3);
        }

        /* 詳細解牌面板 */
        .result-panel {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 14, 26, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(223, 183, 85, 0.2);
            opacity: 0;
            transform: translateY(25px);
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        .result-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .panel-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .panel-header h2 {
            color: var(--gold);
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .panel-header .meta-tag {
            font-size: 0.8rem;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        .reading-section {
            margin-bottom: 18px;
        }
        .reading-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            color: var(--gold);
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .section-title::before {
            content: "✦";
            margin-right: 8px;
            font-size: 0.8rem;
        }

        .section-content {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ccc7d6;
            padding-left: 16px;
            text-align: justify;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 40px;
            font-size: 0.95rem;
            border-radius: 30px;
            cursor: pointer;
            margin: 25px 0;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(223, 183, 85, 0.1);
        }

        .btn:active {
            background: rgba(223, 183, 85, 0.15);
            box-shadow: 0 0 15px var(--gold-glow);
        }
        
        .btn:disabled {
            border-color: #4a4231;
            color: #6e6551;
            cursor: not-allowed;
        }

        @keyframes shuffle-effect {
            0% { transform: scale(0.95) rotate(-5deg) translateY(-5px); }
            100% { transform: scale(1.02) rotate(5deg) translateY(5px); }
        }
    </style>
</head>
<body>

    <!-- 懸浮粒子畫布 -->
    <canvas id="particleCanvas"></canvas>

    <header>
        <h1>御神啟示錄</h1>
        <p class="subtitle">解鎖完整 78 張命運星軌。閉上雙眼，輕觸卡牌，窺探今日的深度奧祕。</p>
    </header>

    <div class="card-container">
        <div class="tarot-card" id="tarotCard" onclick="flipCard()">
            <div class="card-inner">
                <div class="card-back"></div>
                <div class="card-front" id="cardFront">
                    <div class="card-title" id="cardName">--</div>
                    <div class="card-icon" id="cardIcon">✦</div>
                    <div class="card-orientation" id="cardPos">--</div>
                </div>
            </div>
        </div>
    </div>

    <div class="result-panel" id="resultPanel">
        <div class="panel-header">
            <h2 id="resultCardTitle">--</h2>
            <div class="meta-tag">78大密儀 ✦ 今日軌跡深度解讀</div>
        </div>
        
        <div class="reading-section">
            <div class="section-title">今日總運（能量核心）</div>
            <div class="section-content" id="analysisGeneral">載入中...</div>
        </div>

        <div class="reading-section">
            <div class="section-title">事業與學業指引</div>
            <div class="section-content" id="analysisWork">載入中...</div>
        </div>

        <div class="reading-section">
            <div class="section-title">戀愛與人際磁場</div>
            <div class="section-content" id="analysisLove">載入中...</div>
        </div>
    </div>

    <button class="btn" id="actionBtn" onclick="startShuffle()">重新凝聚心神</button>

    <script>
        // 1. 定義 78 張塔羅牌完整名冊
        const majorArcana = [
            "愚者 (The Fool)", "魔術師 (The Magician)", "女祭司 (The High Priestess)", "女皇 (The Empress)",
            "皇帝 (The Emperor)", "教皇 (The Hierophant)", "戀人 (The Lovers)", "戰車 (The Chariot)",
            "力量 (Strength)", "隱士 (The Hermit)", "命運之輪 (Wheel of Fortune)", "正義 (Justice)",
            "倒吊人 (The Hanged Man)", "死神 (Death)", "節制 (Temperance)", "惡魔 (The Devil)",
            "高塔 (The Tower)", "星星 (The Star)", "月亮 (The Moon)", "太陽 (The Sun)",
            "審判 (Judgement)", "世界 (The World)"
        ];

        const suits = [
            { name: "權杖 (Wands)", icon: "🪄", element: "火元素" },
            { name: "聖杯 (Cups)", icon: "🏆", element: "水元素" },
            { name: "寶劍 (Swords)", icon: "⚔️", element: "風元素" },
            { name: "金幣 (Pentacles)", icon: "🪙", element: "土元素" }
        ];

        const courtNumbers = ["王牌 (Ace)", "二", "三", "四", "五", "六", "七", "八", "九", "十", "侍從 (Page)", "騎士 (Knight)", "王后 (Queen)", "國王 (King)"];

        // 動態生成完整 78 張牌陣列
        let tarotDeck78 = [];

        // 注入 22 張大阿爾克那
        majorArcana.forEach((name, index) => {
            tarotDeck78.push({
                name: name,
                type: "Major",
                icon: ["🃏","✨","🌙","👑","🔱","📜","💖","🎖️","🦁","⏳","🎡","⚖️","🧘","💀","⚱️","👿","⚡","⭐","🌕","☀️","🎺","🌍"][index] || "🔮",
                element: "大阿爾克那核心命運"
            });
        });

        // 注入 56 張小阿爾克那
        suits.forEach(suit => {
            courtNumbers.forEach(num => {
                tarotDeck78.push({
                    name: `${suit.name} ${num}`,
                    type: "Minor",
                    icon: suit.icon,
                    element: suit.element
                });
            });
        });

        // 2. 建立靈性演算法：為 78 張牌即時精準生成多維度繁體中文解牌
        function generateReading(card, orientation) {
            const isUp = orientation === "upright";
            
            // 基礎神祕學詞庫，確保語氣與內容完全契合塔羅邏輯
            const lex = {
                Major: {
                    upright: {
                        gen: `今日正逢${card.name}的高維能量顯現。這代表一個重大的生命核心課題正在浮現。你目前的磁場非常宏大，宇宙正在為你指引一條充滿啟發的道路。不論面對何種現狀，你的內在神性都在覺醒，這是一個不可多得的開創與轉折點。`,
                        work: "事業與學業上，你將迎來核心競爭力的爆發。此時非常適合做大膽的決策，或者是接手高難度的關鍵專案。你的才華和全局觀會受到眾人矚目，請堅定信念，命運正站在你這一邊。",
                        love: "情感磁場極為深刻。單身者有機會邂逅靈魂契合度極高的正緣對象；戀愛中的人則能跨越世俗的摩擦，達到精神上的深度共鳴與承諾，關係將昇華至全新高度。"
                    },
                    reversed: {
                        gen: `當${card.name}逆位顯現，暗示著核心能量受到了短暫的阻塞或過度消耗。你可能正處於某種執念、迷茫或抗拒改變的狀態中。宇宙正透過這個星軌提醒你：外在的卡頓往往源於內心的恐懼，是時候停下腳步，進行一場靈魂大掃除。`,
                        work: "工作或學業正面臨方向性的修正。當心因為過度焦慮或剛愎自用而導致判斷失誤。此時切忌盲目擴張或意氣用事，退一步重新檢視根本問題，才能避免高空踩空。",
                        love: "情感關係中出現了溝通流於表面、或是信任感拉扯的警訊。當心因為過度敏感或冷暴力而將伴侶推遠。單身者容易陷入不切實際的幻想中，需拉長觀察期，理智看清真相。"
                    }
                },
                "火元素": {
                    upright: {
                        gen: `今日權杖的火元素燃燒旺盛，賦予你無與倫比的行動力、熱情與開創意志。你體內的能量正蠢蠢欲動，非常適合去突破過往不敢嘗試的疆界。今天你的直覺就是引擎，想到了就立刻去做！`,
                        work: "職場或學業上展現出驚人的執行力與爆發力。你就像開拓者一樣，能夠帶領團隊跨越障礙。今天極利於開展新計畫、出差、或進行高強度的技術攻關，成效顯著。",
                        love: "感情生活充滿炙熱的火花。單身者若有心儀對象，今天主動出擊會帶來極佳的反響；戀愛中的人則會展現出強烈的保護欲與熱情，能為平淡的生活注入新鮮的激情。"
                    },
                    reversed: {
                        gen: `火元素逆位，意味著這股熱情可能演變成了焦躁、失控，或是能量燃燒殆盡後的疲憊感。你可能正面臨心有餘而力不足的窘境，或是行事過於衝動，缺乏續航力。`,
                        work: "工作上要小心虎頭蛇尾、或是因為脾氣過於急躁而與同事或客戶發生摩擦。計畫可能因為前期缺乏周詳規劃而陷入停滯，此時你需要的是沉澱，而非盲目硬衝。",
                        love: "感情上要提防一時衝動引發的爭執，或者是熱度驟降帶來的冷淡感。雙方可能在某些主導權上產生對立，多給彼此一點空間，避免在情緒激動時說出傷人的話。"
                    }
                },
                "水元素": {
                    upright: {
                        gen: `今日聖杯的水元素溫柔流淌，你的情感感受力、直覺與同理心達到了巔峰。這是一個非常適合療癒自我、與周圍磁場和諧共融的一天。你散發著溫暖的微光，能吸引到同樣良善的能量。`,
                        work: "在團隊合作或學業對接中，你的溝通技巧與情商將成為最強大的潤滑劑。適合進行需要創意思維、客戶關係維護或心理溝通的工作，你能輕易洞察他人的真實需求。",
                        love: "桃花與人際磁場極佳。單身者極易在溫馨的氛圍中吸引到體貼、善解人意的對象；戀愛中的人，今天彼此心靈相通，非常適合進行深刻的談心，感情黏著度大幅提升。"
                    },
                    reversed: {
                        gen: `水元素逆位，代表情感的堤防可能出現了潰決，或者陷入了過度感性、情緒化、甚至溺愛與自我欺騙的漩渦中。你可能正被某種失落感或不安全感綁架。`,
                        work: "職場上要當心將私人情緒帶入公事中，或者因為過度在乎旁人的評價而顯得患得患失、無法果斷決策。部分人要注意職場人際關係的八卦與情緒勒索。",
                        love: "感情中容易出現過度依賴、猜忌或玻璃心的傾向。你可能因為害怕失去而過度緊盯對方，讓關係充滿窒息感。試著將專注力收回到自己身上，先學會愛自己。"
                    }
                },
                "風元素": {
                    upright: {
                        gen: `今日寶劍的風元素破空而來，為你帶來極致的理智、邏輯思維與犀利的洞察力。這是一把雙刃劍，代表今天你需要運用智慧去做出客觀的切割與抉擇，斬斷過去糾纏不清的混亂。`,
                        work: "事業與學業迎來高效期。你的思維清晰，處理複雜數據、合約條款或法律事務時能一針見血。非常適合進行嚴謹的策略規劃、寫作或大刀闊斧的業務整頓。",
                        love: "感情上抱持著理智且成熟的態度。單身者寧缺勿濫，能用清晰的標準篩選對象；戀愛中的人則傾向於用理性探討的方式解決過往的矛盾，雖然少了些甜言蜜語，但卻能建立穩固的共識。"
                    },
                    reversed: {
                        gen: `風元素逆位，暗示著理智的失衡。這可能表現為過度思考、精神焦慮失眠，或是言語變成了傷人的利刃。你可能正深陷思維的死胡同裡，不斷內耗。`,
                        work: "工作上當心口舌是非與小人中傷。你的言論可能過於尖銳而引來反彈。同時，計畫容易卡在思維混亂中，出現決策反覆無常、或是資訊不對稱導致的失誤。",
                        love: "感情中要當心言語上的針鋒相對。這段時間彼此容易冷言冷語、翻舊帳，造成精神上的折磨。單身者容易因為過度防備與挑剔，而將真正合適的人拒之門外。"
                    }
                },
                "土元素": {
                    upright: {
                        gen: `今日金幣的土元素沉穩落地，帶來豐盛的實質顯化、財運與安全感。這是一個講求耕耘與收穫的一天。你過去的努力正在轉化為看得見、摸得著的成果，磁場踏實且充滿力量。`,
                        work: "事業與學業運勢極為穩健。非常適合處理與預算、財務、房產、或是長期架構規劃相關的事務。你的踏實作風會贏得上司或合作夥伴的高度信任，回報指日可待。",
                        love: "感情建立在無比堅實的物質與日常基礎上。單身者易遇到背景踏實、性格沉穩的相親或合作對象；戀愛中的人則會開始具體規劃買房、理財或成家等現實目標，關係極具安全感。"
                    },
                    reversed: {
                        gen: `土元素逆位，暗示著物質層面的動盪，或是陷入了過度守舊、拜金、或是沉重的現實壓力中。你可能正過度擔心財務問題，或是因為缺乏彈性而錯失良機。`,
                        work: "職場上當心進度因為墨守成規而停滯不前。此時不宜進行大額的盲目投資，需密切注意現金流的健康狀況。部分人要注意因為利益分配不均與同事產生過節。",
                        love: "感情中現實問題（如經濟壓力、生活習慣）開始放大，並成為爭吵的導火線。當心關係變得過於功利或冷漠乏味。雙方需要坐下來，用務實但溫和的方式重新對齊財務規劃。"
                    }
                }
            };

            const pool = lex[card.element] || lex["Major"];
            return isUp ? pool.upright : pool.reversed;
        }

        // 3. 全局狀態控制
        let isShuffling = false;
        let isFlipped = false;
        let pickedCard = null;
        let pickedOrientation = "upright";

        const cardEl = document.getElementById('tarotCard');
        const cardFrontEl = document.getElementById('cardFront');
        const actionBtn = document.getElementById('actionBtn');
        const resultPanel = document.getElementById('resultPanel');

        function startShuffle() {
            if (isShuffling) return;

            isShuffling = true;
            isFlipped = false;
            cardEl.classList.remove('flipped');
            resultPanel.classList.remove('show');
            actionBtn.disabled = true;
            actionBtn.innerText = "星軌洗牌中，凝聚能量...";

            cardEl.classList.add('shuffling');

            setTimeout(() => {
                cardEl.classList.remove('shuffling');
                isShuffling = false;
                actionBtn.disabled = false;
                actionBtn.innerText = "重新抽牌";

                // 從 78 張牌中實行【完全隨機算法】
                const randomIndex = Math.floor(Math.random() * tarotDeck78.length);
                pickedCard = tarotDeck78[randomIndex];
                pickedOrientation = Math.random() >= 0.5 ? "upright" : "reversed";

            }, 1200);
        }

        function flipCard() {
            if (isShuffling || isFlipped || !pickedCard) return;

            isFlipped = true;

            const orientationText = pickedOrientation === "upright" ? "正位" : "逆位";
            const reading = generateReading(pickedCard, pickedOrientation);

            // 渲染牌面
            document.getElementById('cardName').innerText = pickedCard.name;
            document.getElementById('cardIcon').innerText = pickedCard.icon;
            document.getElementById('cardPos').innerText = `${pickedCard.element} ✦ ${orientationText}`;

            if (pickedOrientation === "reversed") {
                cardFrontEl.classList.add('reversed-visual');
            } else {
                cardFrontEl.classList.remove('reversed-visual');
            }

            // 渲染深度解析
            document.getElementById('resultCardTitle').innerText = `${pickedCard.name} ✦ ${orientationText}`;
            document.getElementById('analysisGeneral').innerText = reading.gen;
            document.getElementById('analysisWork').innerText = reading.work;
            document.getElementById('analysisLove').innerText = reading.love;

            cardEl.classList.add('flipped');

            setTimeout(() => {
                resultPanel.classList.add('show');
                resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 450);
        }


        // 4. HTML5 Canvas 懸浮粒子特效核心引擎
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 40; // 手機端保持流暢的粒子黃金數量

        // 自動適應手機視窗大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 建立單個粒子的構造函數
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height; // 從螢幕下方或內部生成
                this.size = Math.random() * 2.5 + 0.5; // 粒子的精緻大小
                this.speedY = Math.random() * 0.4 + 0.1; // 緩緩上升的速度
                this.speedX = (Math.random() - 0.5) * 0.2; // 左右微微飄移
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;

                // 如果粒子飄出螢幕上方，重置回底部
                if (this.y < 0) {
                    this.y = canvas.height + Math.random() * 20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.fillStyle = `rgba(223, 183, 85, ${this.opacity})`;
                ctx.shadowBlur = this.size * 2;
                ctx.shadowColor = '#dfb755';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // 重置發光避免效能內耗
            }
        }

        // 初始化粒子群
        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
                // 讓初始粒子隨機分佈在整個畫面中，而不是全部從底部出發
                particlesArray[i].y = Math.random() * canvas.height;
            }
        }

        // 動畫循環
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        // 手機觸碰互動：增加一絲靈動
        window.addEventListener('touchmove', (e) => {
            if(particlesArray.length > 0) {
                // 讓其中一個粒子跟隨手指，產生神祕互動感
                const touch = e.touches[0];
                let p = particlesArray[Math.floor(Math.random() * particlesArray.length)];
                p.x = touch.clientX;
                p.y = touch.clientY;
            }
        });

        // 啟動
        window.onload = function() {
            initParticles();
            animateParticles();
            startShuffle();
        }
    </script>
</body>
</html>
